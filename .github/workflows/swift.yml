name: Swift

# memory-archive is this fork's working branch (qooViewer pins it by branch +
# revision), so it has to be built and tested here as well as main.
on:
  push:
    branches: [ main, memory-archive ]
  pull_request:
    branches: [ main, memory-archive ]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, macos-15, macos-26, ubuntu-22.04, ubuntu-24.04]

    steps:
    - uses: actions/checkout@v6
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
